authentication:
  style: tiered
  summary: >-
    Free public tier — no auth for discovery and most REST/MCP calls. Pro Bearer
    (OAuth 2.0 authorization-code) required only for premium tools such as
    initiate_checkout. See authentication/curie-authentication.yml.
pagination:
  style: page-number
  params: [page, pageSize]
  evidence: openapi GET /api/products supports page=1&pageSize=20
rate_limiting:
  public: 100 req/min per IP (unauthenticated callers)
  pro: 1000 req/min per subscriber
  signaling: not documented in spec
idempotency:
  key_header: false
  notes: >-
    No idempotency-key header/param is documented. Several MCP tools are
    operation-level idempotent by design — cancel_cart and cancel_checkout are
    documented as idempotent (re-cancelling is a no-op), and
    curie_cart_aggregate_add uses UPSERT-increment semantics. There is no
    general retry-safety idempotency contract for create/write operations.
