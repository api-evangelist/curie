aid: curie
name: Curie
description: >-
  Curie (Curie Vision, Inc.) is the commerce layer for AI — it connects AI
  assistants like ChatGPT, Claude, and Gemini to real product catalogs from
  5.6M+ Shopify stores via the Model Context Protocol (MCP). Results carry live
  prices, real inventory, affiliate purchase links, and interactive 3D digital
  twins (GLB/USDZ) that shoppers can rotate and view in AR. Curie publishes a
  public REST catalog API, a hosted MCP server exposing 30 commerce tools, and
  cross-protocol discovery profiles (MCP, UCP, A2A, OpenAI Apps SDK). Most
  discovery and tool calls run on a free public tier with no auth; a Pro Bearer
  is required only for premium tools such as checkout. Backed by 500 Global.
